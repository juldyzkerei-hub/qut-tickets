<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUT билет</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{margin:0;background:#0e0d0b;color:#f8f2e8;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 16px}.brand{font-size:32px;font-weight:900;letter-spacing:6px;color:#d9b777;text-align:center}.ticket{margin-top:24px;background:#f8f2e8;color:#20180e;border-radius:18px;padding:24px}.label{font-size:11px;color:#6c6257}.big{font-size:22px;font-weight:800;margin:5px 0 16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.qr{display:flex;justify-content:center;margin-top:20px}.msg{text-align:center;margin-top:28px;color:#b9aa96}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="brand">QUT</div><div id="loading" class="msg">Билет жүктелуде...</div><div id="card" class="ticket" hidden>
<div class="label">КЕШ</div><div class="big" id="ev"></div><div id="venue"></div><hr>
<div class="row"><div><div class="label">ҚОНАҚ</div><div class="big" id="guest"></div></div><div><div class="label">БИЛЕТ №</div><div id="tid"></div></div></div>
<div class="label">ОРЫНДАР</div><div class="big" id="seats"></div><div class="label">СОМА</div><div class="big" id="amount"></div><div id="qr" class="qr"></div><p class="msg" style="color:#6c6257">Кіру кезінде осы билетті көрсетіңіз.</p></div><div id="err" class="msg"></div></div>
<script>
(async function(){
 const g=x=>document.getElementById(x),load=g('loading'),card=g('card'),err=g('err');
 try{
  const id=new URLSearchParams(window.location.search).get('id');
  if(!id) throw new Error('Билет нөмірі табылмады');
  const sb=window.supabase.createClient('https://bsdbkzopylzghywassii.supabase.co','sb_publishable_Sktu6sRdYMzw0GepkcyJWg_PRwAqcfg');
  const r=await sb.rpc('get_ticket',{p_ticket_id:id}),t=r.data&&r.data[0];
  if(r.error||!t||t.status!=='valid') throw new Error('Билет табылмады');
  g('ev').textContent=t.event_name+' • '+(t.event_date||'')+' '+(t.event_time||'');
  g('venue').textContent=t.venue||'';g('guest').textContent=t.customer_name||'Қонақ';g('tid').textContent=t.id;
  g('seats').textContent=(t.seats||[]).map(x=>x.table_no+'-үстел, '+x.seat_no+'-орын').join(' • ');
  g('amount').textContent=new Intl.NumberFormat('kk-KZ').format(t.amount||0)+' ₸';
  load.hidden=true;card.hidden=false;if(window.QRCode)new QRCode(g('qr'),{text:window.location.href,width:190,height:190});
 }catch(e){load.hidden=true;err.textContent=e.message||'Билетті ашу қатесі';}
})();</script></body></html>
